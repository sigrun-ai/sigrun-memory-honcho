# CI: thin caller over the family's reusable workflow in sigrun-ai/sigrun
# (release workstream Task 2.2) — the jobs live there so they cannot
# drift across the 10 repos. needs-core: true (the @sigrun/sigrun file: sibling dev dep).
# core-ref: main during a joint train (C1): the lane needs the unreleased.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: sigrun-ai/sigrun/.github/workflows/ext-ci.yml@main
    with:
      needs-core: true
      # C1 train-time flip: test against core main, which carries the
      # pi-durable 1.6.0 this lane needs. Flip back to release once
      # core 0.22.0 is live on the registry.
      core-ref: main
